<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BFO Web Links</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">BFO Web Links <span class="phase">Hub</span></div>
    <div class="topbar-actions"><button id="checkUpdates" class="btn ghost" type="button">Check for Updates</button><button id="openNews" class="btn ghost" type="button" aria-haspopup="dialog">News</button><span id="updateStatus" class="save-status"></span></div>
  </header>

  <main class="link-hub">
    <section class="card link-panel">
      <div class="card-head">
        <h2>Pages</h2>
      </div>

      <div class="link-grid">
        <button class="btn primary link-card" data-url="/web1/index.html">
          <span class="link-title">Mission Builder</span>
          <span class="muted small">Build and edit mission data</span>
        </button>

        <button class="btn link-card" data-url="/web2/">
          <span class="link-title">Account Editor</span>
          <span class="muted small">Edit units, items, and account info</span>
        </button>

        <button class="btn link-card" data-url="https://villin.lol/v/bf/">
          <span class="link-title">Brave Frontier Database</span>
          <span class="muted small">Browse units, items, and game data</span>
        </button>

        <button class="btn link-card" type="button" disabled>
          <span class="link-title">Web Page 4</span>
          <span class="muted small">Coming soon</span>
        </button>

        <button class="btn link-card" type="button" disabled>
          <span class="link-title">Web Page 5</span>
          <span class="muted small">Coming soon</span>
        </button>

        <button class="btn link-card" type="button" disabled>
          <span class="link-title">Web Page 6</span>
          <span class="muted small">Coming soon</span>
        </button>
      </div>
    </section>
  </main>

  <dialog id="newsDialog" class="news-dialog" aria-labelledby="newsTitle">
    <div class="card-head"><h2 id="newsTitle">News &amp; Patch Notes</h2><button id="closeNews" class="btn ghost" type="button">Close</button></div>
    <p class="muted small">What's changed in each BFO Tools release.</p>
    <div id="newsContent" aria-live="polite"></div>
    <button id="refreshNews" class="btn" type="button">Refresh news</button>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
